# Postgres para desarrollo. Un solo servicio, sin monorepo.
# El puerto 5433 es para no chocar con un Postgres local en 5432.
# Si lo cambias, cambialo tambien en .env (DATABASE_URL).
services:
  db:
    image: postgres:17-alpine
    container_name: nexa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexa
      POSTGRES_PASSWORD: nexa
      POSTGRES_DB: nexa
    ports:
      # Solo localhost: la DB de desarrollo no deberia estar expuesta a la red.
      - "127.0.0.1:5433:5432"
    volumes:
      - nexa-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexa -d nexa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexa-db-data:
